name: CI

on:
  push:
    branches: [dev, staging]
  pull_request:
    branches: [dev, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      PLATFORM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres_platform?schema=public
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run prisma:generate
        name: Generate Prisma clients (base, platform, tenant)

      - run: npx next typegen
        name: Generate Next.js route types

      - run: npx tsc --noEmit
        name: Type-check

      - run: npm test
        name: Run tests

      - run: npx next build
        name: Build

  deploy-dev:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run prisma:generate
        name: Generate Prisma clients (base, platform, tenant)

      - name: Check Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel not configured. Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets on the 'dev' GitHub environment."
            exit 1
          fi

      - name: Run database migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate deploy --schema=prisma/platform.schema.prisma

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Deploy to Vercel
        id: deploy
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run prisma:generate
        name: Generate Prisma clients (base, platform, tenant)

      - name: Check Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel not configured. Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets on the 'staging' GitHub environment."
            exit 1
          fi

      - name: Run database migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate deploy --schema=prisma/platform.schema.prisma

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Deploy to Vercel
        id: deploy
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
